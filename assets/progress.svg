<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#111827">How close can a fast algorithm get to a Nash equilibrium?</text>
  <text x="40" y="80" font-size="15" fill="#4b5563">Best guarantee (ε) for polynomial-time algorithms in two-player games. Lower is better: 0 would be an exact Nash equilibrium.</text>

  <!-- axis: x = 80 + (0.5 - eps) * 1600  => eps 0.5 -> 80, eps 0 -> 880 -->
  <line x1="80" y1="250" x2="880" y2="250" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="13" fill="#6b7280" text-anchor="middle">
    <line x1="80" y1="244" x2="80" y2="256" stroke="#9ca3af" stroke-width="2"/><text x="80" y="276">0.50</text>
    <line x1="240" y1="244" x2="240" y2="256" stroke="#9ca3af" stroke-width="2"/><text x="240" y="276">0.40</text>
    <line x1="400" y1="244" x2="400" y2="256" stroke="#9ca3af" stroke-width="2"/><text x="400" y="276">0.30</text>
    <line x1="560" y1="244" x2="560" y2="256" stroke="#9ca3af" stroke-width="2"/><text x="560" y="276">0.20</text>
    <line x1="720" y1="244" x2="720" y2="256" stroke="#9ca3af" stroke-width="2"/><text x="720" y="276">0.10</text>
    <line x1="880" y1="244" x2="880" y2="256" stroke="#9ca3af" stroke-width="2"/><text x="880" y="276">0 (exact)</text>
  </g>
  <text x="80" y="300" font-size="12" fill="#6b7280">← looser guarantee</text><text x="880" y="300" font-size="12" fill="#6b7280" text-anchor="end">tighter guarantee →</text>

  <!-- 16 years stuck near 1/3 band -->
  <rect x="257" y="234" width="102" height="32" rx="6" fill="#f3f4f6"/>

  <!-- prior results (gray) -->
  <g font-size="12.5" fill="#374151" text-anchor="middle">
    <circle cx="80" cy="250" r="8" fill="#9ca3af"/>
    <line x1="80" y1="242" x2="80" y2="200" stroke="#d1d5db"/>
    <text x="80" y="176" font-weight="700">1/2</text><text x="80" y="192">2006</text>

    <circle cx="269" cy="250" r="8" fill="#9ca3af"/>
    <line x1="269" y1="242" x2="200" y2="140" stroke="#d1d5db"/>
    <text x="200" y="116" font-weight="700">0.382</text><text x="200" y="132">2007</text>

    <circle cx="298" cy="250" r="8" fill="#9ca3af"/>
    <line x1="298" y1="242" x2="290" y2="200" stroke="#d1d5db"/>
    <text x="290" y="176" font-weight="700">0.364</text><text x="290" y="192">2007</text>

    <circle cx="337" cy="250" r="8" fill="#9ca3af"/>
    <line x1="337" y1="258" x2="300" y2="330" stroke="#d1d5db"/>
    <text x="300" y="348" font-weight="700">0.3393</text><text x="300" y="364">2007</text>

    <circle cx="347" cy="250" r="8" fill="#6b7280"/>
    <line x1="347" y1="242" x2="390" y2="140" stroke="#d1d5db"/>
    <text x="390" y="116" font-weight="700">1/3</text><text x="390" y="132">2022</text>
  </g>
  <text x="304" y="400" font-size="13" fill="#6b7280" text-anchor="middle">Stuck near 1/3 from 2007 to 2026</text>

  <!-- jump arrow -->
  <path d="M 360 236 C 430 180, 500 180, 548 236" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="548,236 536,230 542,222" fill="#2563eb"/>

  <!-- new result -->
  <circle cx="560" cy="250" r="13" fill="#2563eb"/>
  <circle cx="560" cy="250" r="20" fill="none" stroke="#2563eb" stroke-opacity="0.35" stroke-width="3"/>
  <g text-anchor="middle">
    <text x="560" y="330" font-size="22" font-weight="800" fill="#1d4ed8">1/5 = 0.2</text>
    <text x="560" y="352" font-size="13" fill="#1f2937">Nov 2026 · Cogentic (Gemini 4)</text>
    <text x="560" y="370" font-size="13" fill="#1f2937">AI-generated proof, not yet peer reviewed</text>
  </g>

  <!-- unknown hardness zone -->
  <rect x="640" y="234" width="236" height="32" rx="6" fill="#fef3c7" fill-opacity="0.7"/>
  <text x="758" y="200" font-size="12.5" fill="#92400e" text-anchor="middle">Open territory: no known fast</text>
  <text x="758" y="216" font-size="12.5" fill="#92400e" text-anchor="middle">algorithm, and believed hard near 0</text>
</svg>
